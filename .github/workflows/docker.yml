# Docker build and publish to GitHub Container Registry
#
# ⚠️  DISABLED: Next.js 15 + webpack has a V8 memory bug that crashes builds
#     on GitHub Actions runners (see crbug.com/1201626)
#
# To build and publish manually:
#   1. Install Node 20 LTS (not v25+)
#   2. Run: cd frontend && npm run build
#   3. Run: docker build -t ghcr.io/sunnypatell/securebank-ctf .
#   4. Run: docker push ghcr.io/sunnypatell/securebank-ctf
#
# Or use Docker locally:
#   docker run --rm -p 3000:3000 -v securebank-data:/app/data ghcr.io/sunnypatell/securebank-ctf

name: Docker

on:
  workflow_dispatch:

jobs:
  info:
    name: Build Info
    runs-on: ubuntu-latest
    steps:
      - name: Build disabled
        run: |
          echo "⚠️  Docker builds are temporarily disabled"
          echo ""
          echo "Next.js 15 has a V8 memory bug that crashes webpack builds"
          echo "on constrained environments like GitHub Actions runners."
          echo ""
          echo "Workaround: Build locally with Node 20 LTS and push manually."
          echo ""
          echo "See: https://bugs.chromium.org/p/chromium/issues/detail?id=1201626"
          exit 1
