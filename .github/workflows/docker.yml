# Docker build verification workflow
# Verifies the Docker image builds successfully on main branch changes

name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "start.sh"
      - ".dockerignore"
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: securebank-ctf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
