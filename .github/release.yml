# Automatically generated release notes configuration
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    - title: "🚩 New Challenges"
      labels:
        - challenge
        - new-challenge

    - title: "🚀 Features"
      labels:
        - feat
        - feature
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - fix
        - bug
        - bugfix

    - title: "📚 Documentation"
      labels:
        - docs
        - documentation

    - title: "🔧 Maintenance"
      labels:
        - chore
        - maintenance
        - refactor

    - title: "🔒 Security Updates"
      labels:
        - security
        - dependencies

    - title: "🎓 Other Changes"
      labels:
        - "*"
